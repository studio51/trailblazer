<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Little Days Out</title>
<link rel="stylesheet" href="assets/lda.css" />
<style>
/* ============================================================
   LITTLE DAYS OUT — page styles
   ============================================================ */
#root { min-height: 100dvh; }
.page { min-height: 100dvh; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  font-family: var(--display); font-weight: 600; font-size: 15px;
  padding: 11px 18px; border-radius: var(--r-full); border: none;
  color: var(--ink); background: transparent; line-height: 1; white-space: nowrap;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.btn--coral { background: var(--coral); color: #fff; box-shadow: var(--sh-sm); }
.btn--coral:hover { background: var(--coral-deep); transform: translateY(-1px); box-shadow: var(--sh-md); }
.btn--ghost {
  background: rgba(255,255,255,0.86); color: var(--ink);
  border: 1.5px solid var(--line); backdrop-filter: blur(8px);
}
.btn--ghost:hover { background: #fff; transform: translateY(-1px); }
.btn--lg { padding: 14px 24px; font-size: 17px; }
.btn--block { width: 100%; padding: 14px; font-size: 16px; color: #fff; margin-top: var(--s-4); }
.btn--block:hover { filter: brightness(0.96); transform: translateY(-1px); }

/* ---------- Brand ---------- */
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.brand:hover { text-decoration: none; }
.brand__name { font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--ink); letter-spacing: -0.01em; }

/* ---------- Nav ---------- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px clamp(20px, 5vw, 40px);
  transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease), padding var(--dur) var(--ease);
}
.nav--solid { background: rgba(255,251,243,0.92); backdrop-filter: blur(12px); box-shadow: var(--sh-sm); padding-top: 12px; padding-bottom: 12px; }
.nav__links { display: flex; gap: 28px; }
.nav__links a {
  font-family: var(--display); font-weight: 500; font-size: 16px; color: var(--ink);
  text-decoration: none; opacity: 0.82; transition: opacity var(--dur); white-space: nowrap;
}
.nav__links a:hover { opacity: 1; text-decoration: none; }
.nav__actions { display: flex; align-items: center; gap: 10px; }
@media (max-width: 880px) { .nav__links { display: none; } }

/* ============================================================
   HERO
   ============================================================ */
.hero { position: relative; height: 100dvh; min-height: 660px; overflow: hidden; background: var(--map-grass); }
.hero__map { position: absolute; inset: 0; }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero__scrim {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, rgba(28,46,18,0.62) 0%, rgba(28,46,18,0.16) 34%, rgba(28,46,18,0) 56%),
    linear-gradient(to right, rgba(28,46,18,0.42) 0%, rgba(28,46,18,0) 42%),
    linear-gradient(to bottom, rgba(28,46,18,0.18) 0%, rgba(28,46,18,0) 22%);
}

/* ---- Pins ---- */
.pins { position: absolute; inset: 0; z-index: 15; }
.pinwrap { display: block; }
.pinwrap--dim .pin { opacity: 0.28; filter: saturate(0.55); pointer-events: none; }
.pin {
  position: absolute; transform: translate(-50%, -100%);
  background: none; border: none; padding: 0; cursor: pointer;
  transition: opacity var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.pin__float {
  display: flex; flex-direction: column; align-items: center;
  animation: floaty 4.6s var(--ease) infinite; animation-delay: var(--delay, 0s);
}
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.pin__badge {
  position: relative; width: 46px; height: 46px; border-radius: 15px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(155deg, color-mix(in srgb, var(--pc) 72%, #fff), var(--pc));
  border: 3px solid #fff; box-shadow: var(--sh-pin);
  transition: transform var(--dur) var(--ease-bounce);
}
.pin--round .pin__badge { border-radius: 50%; }
.pin__badge::after {
  content: ""; position: absolute; inset: 3px; border-radius: 11px;
  background: linear-gradient(158deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 52%); pointer-events: none;
}
.pin--round .pin__badge::after { border-radius: 50%; }
.pin__badge::before {
  content: ""; position: absolute; bottom: -6px; left: 50%; width: 13px; height: 13px;
  transform: translateX(-50%) rotate(45deg); background: var(--pc); border-radius: 3px; z-index: -1;
}
.pin:hover .pin__badge, .pin--on .pin__badge { transform: scale(1.16); }
.pin--on .pin__badge { box-shadow: 0 0 0 5px rgba(255,255,255,0.45), var(--sh-pin); }
.pin__label {
  margin-top: 11px; max-width: 160px;
  background: rgba(36,29,23,0.84); backdrop-filter: blur(6px); color: #fff;
  font-family: var(--display); font-weight: 500; font-size: 12.5px;
  padding: 5px 11px; border-radius: var(--r-full); white-space: nowrap; box-shadow: var(--sh-sm);
}
.pin--on .pin__label { background: var(--pc); }

/* ---- Hero content ---- */
.hero__content {
  position: absolute; z-index: 20;
  left: clamp(20px, 5vw, 72px); bottom: clamp(28px, 6vh, 76px);
  max-width: 600px; color: #fff;
}
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.34);
  backdrop-filter: blur(8px); color: #fff;
  font-family: var(--display); font-weight: 500; font-size: 13.5px;
  padding: 7px 14px 7px 11px; border-radius: var(--r-full); white-space: nowrap;
}
.hero__eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 0 rgba(255,106,69,0.6); animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,106,69,0.55); } 70% { box-shadow: 0 0 0 8px rgba(255,106,69,0); } 100% { box-shadow: 0 0 0 0 rgba(255,106,69,0); } }
.hero__title {
  font-family: var(--display); font-weight: 700; color: #fff;
  font-size: clamp(40px, 6vw, 72px); line-height: 0.98; letter-spacing: -0.02em;
  margin: 16px 0 14px; text-shadow: 0 3px 26px rgba(20,30,10,0.32);
  text-wrap: balance;
}
.hero__sub {
  font-size: clamp(16px, 1.4vw, 19px); line-height: 1.5; color: rgba(255,255,255,0.94);
  max-width: 33em; text-shadow: 0 2px 14px rgba(20,30,10,0.4);
}

/* ---- Search ---- */
.search {
  margin-top: 26px; display: flex; gap: 8px; align-items: center;
  background: #fff; padding: 8px; border-radius: var(--r-full);
  box-shadow: var(--sh-lg); max-width: 580px; flex-wrap: wrap;
}
.search__field { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; min-width: 0; }
.search__field input { flex: 1; border: none; outline: none; background: transparent; min-width: 0; font-family: var(--body); font-size: 16px; font-weight: 600; color: var(--ink); }
.search__field input::placeholder { color: var(--ink-mute); font-weight: 500; }
.search__loc {
  display: inline-flex; align-items: center; gap: 7px; border: none;
  background: var(--cream); color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 14.5px;
  padding: 11px 16px; border-radius: var(--r-full); transition: background var(--dur); white-space: nowrap;
}
.search__loc:hover { background: #FBE9CE; }
.search__loc svg { color: var(--coral); }
.search__go { white-space: nowrap; }

/* ---- Filter chips ---- */
.chips { margin-top: 18px; display: flex; gap: 9px; flex-wrap: wrap; max-width: 640px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
  border: 1.5px solid transparent; color: var(--ink);
  font-family: var(--display); font-weight: 500; font-size: 14.5px;
  padding: 8px 15px; border-radius: var(--r-full); box-shadow: var(--sh-xs); white-space: nowrap;
  transition: transform var(--dur) var(--ease), background var(--dur), color var(--dur);
}
.chip svg { color: var(--pc); transition: color var(--dur); }
.chip:hover { transform: translateY(-2px); }
.chip--on { background: var(--pc); color: #fff; box-shadow: var(--sh-sm); }
.chip--on svg { color: #fff; }

/* ---- Detail card ---- */
.detail {
  position: absolute; z-index: 25; right: clamp(18px, 3vw, 40px); top: 50%;
  transform: translateY(-50%); width: 358px; background: #fff;
  border-radius: 26px; overflow: hidden; box-shadow: var(--sh-xl);
}
.detail__media { position: relative; height: 158px; display: grid; place-items: center; background: linear-gradient(150deg, var(--pcs), #fff); color: var(--pc); }
.detail__mediaGlyph { opacity: 0.85; }
.detail__price { position: absolute; top: 12px; left: 12px; background: #fff; color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 13px; padding: 5px 11px; border-radius: var(--r-full); box-shadow: var(--sh-sm); white-space: nowrap; }
.detail__nav { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); display: flex; justify-content: space-between; padding: 0 10px; }
.detail__nav button { width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,0.94); color: var(--ink); display: grid; place-items: center; box-shadow: var(--sh-sm); cursor: pointer; transition: transform var(--dur); }
.detail__nav button:hover { transform: scale(1.1); }
.detail__cat { position: absolute; bottom: 12px; left: 12px; display: inline-flex; align-items: center; gap: 5px; color: #fff; font-family: var(--display); font-weight: 500; font-size: 12px; padding: 5px 10px; border-radius: var(--r-full); }
.detail__body { padding: 18px; }
.detail__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.detail__head h3 { font-size: 20px; line-height: 1.12; }
.detail__rate { display: inline-flex; align-items: center; gap: 4px; background: var(--cream); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 13px; padding: 4px 9px; border-radius: var(--r-full); flex-shrink: 0; }
.detail__row { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--ink-soft); }
.detail__row b { color: var(--ink); font-weight: 700; white-space: nowrap; }
.detail__row svg { flex-shrink: 0; margin-top: 1px; }
.detail__meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.detail__meta > div { display: flex; flex-direction: column; gap: 3px; }
.detail__metaLabel { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-mute); }
.detail__meta b { font-size: 14px; color: var(--ink); font-weight: 700; }
.detail__blurb { margin-top: 14px; font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); }
.detail__tags { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }
.chiplet { background: var(--cream); color: var(--ink-soft); font-weight: 600; font-size: 12.5px; padding: 5px 11px; border-radius: var(--r-full); white-space: nowrap; }

/* ============================================================
   SECTIONS
   ============================================================ */
.band { padding: clamp(56px, 9vh, 104px) 0; }
.band--cream { background: var(--cream); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 40px); }
.sechead { max-width: 660px; margin-bottom: 44px; }
.sechead h2 { font-size: clamp(30px, 4vw, 46px); margin: 10px 0 14px; line-height: 1.04; }
.sechead__sub { font-size: 18px; color: var(--ink-soft); line-height: 1.5; }
.sechead--center { margin-left: auto; margin-right: auto; text-align: center; }
.sechead--row { display: flex; align-items: flex-end; justify-content: space-between; max-width: none; gap: 24px; flex-wrap: wrap; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.step { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--sh-sm); }
.step__num { position: absolute; top: 22px; right: 26px; font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--line-strong); }
.step__icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; margin-bottom: 18px; }
.step h3 { font-size: 21px; margin-bottom: 8px; }
.step p { font-size: 15.5px; color: var(--ink-soft); line-height: 1.55; }

/* activity cards */
.acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 22px; }
.acard { background: #fff; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--sh-sm); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); cursor: pointer; display: flex; flex-direction: column; }
.acard:hover { transform: translateY(-5px); box-shadow: var(--sh-md); }
.acard__media { position: relative; height: 150px; flex-shrink: 0; display: grid; place-items: center; color: var(--pc); background: linear-gradient(150deg, var(--pcs), #fff); }
.acard__cat { position: absolute; bottom: 10px; left: 10px; background: var(--pc); color: #fff; font-family: var(--display); font-weight: 500; font-size: 12px; padding: 4px 10px; border-radius: var(--r-full); white-space: nowrap; }
.acard__heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,0.92); color: var(--ink-soft); display: grid; place-items: center; box-shadow: var(--sh-xs); cursor: pointer; transition: color var(--dur), transform var(--dur); }
.acard__heart:hover { color: var(--coral); transform: scale(1.1); }
.acard__body { padding: 16px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.acard__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.acard__top h3 { font-size: 17px; line-height: 1.25; }
.acard__rate { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--ink); flex-shrink: 0; }
.acard__meta { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-mute); }
.acard__foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
.acard__price { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--ink); white-space: nowrap; }
.acard__foot { gap: 12px; }
.acard__more { display: inline-flex; align-items: center; gap: 5px; color: var(--coral); font-family: var(--display); font-weight: 600; font-size: 14.5px; }

/* category tiles */
.cattiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(218px, 1fr)); gap: 18px; }
.cattile { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; text-align: left; box-shadow: var(--sh-sm); cursor: pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur), border-color var(--dur); }
.cattile:hover { transform: translateY(-3px); box-shadow: var(--sh-md); border-color: var(--pc); }
.cattile__icon { width: 52px; height: 52px; border-radius: 16px; background: var(--pcs); color: var(--pc); display: grid; place-items: center; flex-shrink: 0; }
.cattile__label { flex: 1; font-family: var(--display); font-weight: 500; font-size: 16.5px; color: var(--ink); }
.cattile__arrow { color: var(--pc); opacity: 0.5; transition: transform var(--dur), opacity var(--dur); }
.cattile:hover .cattile__arrow { opacity: 1; transform: translateX(3px); }

/* quotes */
.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.quote { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--sh-sm); }
.quote__mark { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 0.5; height: 28px; }
.quote blockquote { margin: 0 0 22px; font-size: 16.5px; line-height: 1.55; color: var(--ink); }
.quote figcaption { display: flex; align-items: center; gap: 12px; }
.quote__av { width: 44px; height: 44px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; flex-shrink: 0; }
.quote figcaption b { display: block; color: var(--ink); font-size: 15px; }
.quote figcaption small { color: var(--ink-mute); font-size: 13px; }

/* CTA */
.cta { position: relative; overflow: hidden; padding: clamp(64px, 10vh, 116px) 24px; background: linear-gradient(135deg, var(--coral), var(--coral-deep)); color: #fff; text-align: center; }
.cta::before, .cta::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1); }
.cta::before { width: 380px; height: 380px; top: -160px; left: -120px; }
.cta::after { width: 300px; height: 300px; bottom: -150px; right: -90px; }
.cta__inner { position: relative; z-index: 1; max-width: 660px; margin: 0 auto; }
.cta__suns { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; }
.cta__suns span { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,0.18); }
.cta h2 { color: #fff; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.02; }
.cta p { color: rgba(255,255,255,0.94); font-size: 18px; line-height: 1.5; margin: 16px auto 28px; max-width: 32em; }
.cta__form { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.cta__form input { flex: 1 1 280px; max-width: 340px; padding: 15px 20px; border-radius: var(--r-full); border: none; outline: none; font-family: var(--body); font-size: 16px; font-weight: 600; color: var(--ink); box-shadow: var(--sh-md); }
.cta__form .btn--coral { background: var(--ink); }
.cta__form .btn--coral:hover { background: #000; }
.cta__done { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.2); padding: 15px 26px; border-radius: var(--r-full); font-family: var(--display); font-weight: 600; font-size: 17px; }
.cta__stores { margin-top: 24px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.cta .store { display: inline-flex; align-items: center; gap: 7px; color: rgba(255,255,255,0.94); font-family: var(--display); font-weight: 500; font-size: 14.5px; white-space: nowrap; }

/* footer */
.footer { background: var(--ink); color: rgba(255,255,255,0.78); padding: 56px 0 28px; }
.footer .brand__name { color: #fff; }
.footer__grid { display: flex; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
.footer__tag { margin-top: 14px; color: rgba(255,255,255,0.6); font-size: 15px; font-family: var(--display); }
.footer__cols { display: flex; gap: 56px; flex-wrap: wrap; }
.footer__cols b { white-space: nowrap; }
.footer__cols > div { display: flex; flex-direction: column; gap: 11px; }
.footer__cols b { color: #fff; font-family: var(--display); font-weight: 600; font-size: 15px; margin-bottom: 3px; }
.footer__cols a { color: rgba(255,255,255,0.7); font-size: 14.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.footer__cols a:hover { color: var(--coral); text-decoration: none; }
.footer__base { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; white-space: nowrap; margin-top: 44px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 13.5px; color: rgba(255,255,255,0.5); }

/* ============================================================
   RESPONSIVE — collapse hero to stacked layout
   ============================================================ */
@media (max-width: 980px) {
  .hero { height: auto; min-height: 0; }
  .hero__map { position: relative; height: 56vh; min-height: 380px; }
  .hero__content {
    position: static; max-width: none; color: var(--ink);
    padding: 36px clamp(20px, 6vw, 40px) 8px; background: var(--paper);
  }
  .hero__title { color: var(--ink); text-shadow: none; }
  .hero__sub { color: var(--ink-soft); text-shadow: none; }
  .hero__eyebrow { background: var(--coral-soft); border-color: transparent; color: var(--coral-deep); }
  .chip { background: #fff; box-shadow: var(--sh-xs); border-color: var(--line); }
  .detail {
    position: static; transform: none; width: auto; margin: 16px clamp(20px, 6vw, 40px) 36px;
    border: 1px solid var(--line); animation: none;
  }
  .detail__media { height: 150px; }
}
@media (max-width: 760px) {
  .steps, .quotes { grid-template-columns: 1fr; }
  .sechead--row { align-items: flex-start; }
}
@media (max-width: 980px) {
  .nav { background: rgba(255,251,243,0.92); backdrop-filter: blur(12px); box-shadow: var(--sh-sm); }
}
</style>
</head>

<div id="root"></div>

  </svg>
